; Realistic Sim Phenotypes - settings
; Edit this file with any text editor, then restart the game.

[population]
; Population profile applied to generated Sims.
; Available: europe, france, uk, usa, germany, spain, italy, netherlands, sweden, poland,
; japan, china, korea, india
profile = europe

; true: apply the profile to every Sim the game generates (townies, NPCs, service Sims,
; dating app profiles, Sims offered for adoption).
; Newborns, clones, reincarnated Sims and premade Sims are never changed.
; Sims already in your save are not changed: see the rsim.reroll console command.
auto_apply = true

; true: only use EA hair, beard, eyebrow and eye colour parts (ignore custom content).
; Skin tones always come from the official list shipped with the mod.
official_only = true

; true: give generated Sims eyes, nose and mouth shapes from the EA face presets that EA tagged
; for their origin (e.g. Asian eyelids only for East Asian Sims).
face_presets = true

; true: give generated Sims first and last names from EA's name list for their origin
; (Japanese, Chinese, Indian, Moroccan, Latin, Islander, Southeast Asian, Native American).
; European and African Sims keep names in the game's language.
names = true
